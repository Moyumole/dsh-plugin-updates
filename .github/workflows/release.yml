name: release

# One-tag release: push a v* tag (after bumping package.json) and this workflow
# verifies the tree, publishes the exact version to npm when it is not there yet
# (requires the NPM_TOKEN repository secret), and creates the GitHub Release.
# The npm step is skipped with a notice when NPM_TOKEN is absent, and the GitHub
# Release is still created, so the two halves can be recovered independently.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify sources and tests
        run: |
          node scripts/build-client.mjs --check
          node --test test/*.test.mjs
      - name: Resolve package name and version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish to npm when needed
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice title=npm publish skipped::NPM_TOKEN secret is not configured; add it in Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          NAME="${{ steps.pkg.outputs.name }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice title=npm publish skipped::$NAME@$VERSION is already published."
            exit 0
          fi
          npm publish --provenance --access public
          npm view "$NAME@$VERSION" version
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
