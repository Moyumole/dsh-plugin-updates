name: release

# One-tag release: push a v* tag (after bumping package.json) and this workflow
# verifies the tree, creates the GitHub Release from the matching CHANGELOG
# section, and publishes the exact version to npm when it is not there yet.
#
# npm publishing uses npm Trusted Publishing (OIDC): the package is configured,
# one time, with "Publisher: GitHub Actions, Organization/user: Moyumole,
# Repository: dsh-plugin-updates, Workflow filename: release.yml, Allow npm
# publish". No NPM_TOKEN secret is needed; `id-token: write` below lets npm
# exchange a short-lived OIDC token (and produce provenance).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify sources and tests
        run: |
          node scripts/build-client.mjs --check
          node --test test/*.test.mjs
      - name: Resolve package name and version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"
            exit 0
          fi
          VERSION="${TAG#v}"
          NOTES=/tmp/release-notes.md
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found = 1 }
            }
            found { print }
          ' CHANGELOG.md > "$NOTES"
          if [ -s "$NOTES" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@12.2.1
          npm --version
      - name: Publish to npm when needed (Trusted Publishing / OIDC)
        run: |
          NAME="${{ steps.pkg.outputs.name }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          # Query the registry API directly: `npm view` adds another cache layer,
          # and the CDN in front of registry.npmjs.org can serve a stale packument
          # for several minutes after a successful publish.
          registry_has_version() {
            node -e '
              const [name, version] = process.argv.slice(1)
              const path = name.replace("/", "%2F")
              const url = `https://registry.npmjs.org/${path}/${version}?ts=${Date.now()}`
              fetch(url, { headers: { 'cache-control': 'no-cache' } })
                .then((response) => process.exit(response.ok ? 0 : 1))
                .catch(() => process.exit(1))
            ' "$NAME" "$VERSION"
          }
          if registry_has_version; then
            echo "::notice title=npm publish skipped::$NAME@$VERSION is already published."
            exit 0
          fi
          npm publish --provenance --access public
          # The version can take a while to become visible through the CDN (a
          # publish that returned success once showed up ~20 minutes later), so
          # the check is advisory: a slow CDN must not mark a successful release
          # as failed.
          for attempt in $(seq 1 40); do
            if registry_has_version; then
              echo "verified $NAME@$VERSION on the registry"
              exit 0
            fi
            echo "registry propagation pending ($attempt/40); retrying in 30s"
            sleep 30
          done
          echo "::warning title=npm verification pending::$NAME@$VERSION was published (npm publish succeeded) but is not visible through the registry CDN yet. Check https://www.npmjs.com/package/$NAME before assuming a failure."

