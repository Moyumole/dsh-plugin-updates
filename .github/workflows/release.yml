name: release

# One-tag release: push a v* tag (after bumping package.json) and this workflow
# verifies the tree, creates the GitHub Release from the matching CHANGELOG
# section, and publishes the exact version to npm when it is not there yet.
#
# npm publishing uses npm Trusted Publishing (OIDC): the package is configured,
# one time, with "Publisher: GitHub Actions, Organization/user: Moyumole,
# Repository: dsh-plugin-updates, Workflow filename: release.yml, Allow npm
# publish". No NPM_TOKEN secret is needed; `id-token: write` below lets npm
# exchange a short-lived OIDC token (and produce provenance).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify sources and tests
        run: |
          node scripts/build-client.mjs --check
          node --test test/*.test.mjs
      - name: Resolve package name and version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"
            exit 0
          fi
          VERSION="${TAG#v}"
          NOTES=/tmp/release-notes.md
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found = 1 }
            }
            found { print }
          ' CHANGELOG.md > "$NOTES"
          if [ -s "$NOTES" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version
      - name: Publish to npm when needed (Trusted Publishing / OIDC)
        run: |
          NAME="${{ steps.pkg.outputs.name }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice title=npm publish skipped::$NAME@$VERSION is already published."
            exit 0
          fi
          npm publish --provenance --access public
          # The registry API can lag behind a successful publish (the same
          # version often 404s for a few minutes), so verify with retries
          # instead of failing the whole release on that race.
          for attempt in $(seq 1 12); do
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "verified $NAME@$VERSION on the registry"
              exit 0
            fi
            echo "registry propagation pending ($attempt/12); retrying in 15s"
            sleep 15
          done
          echo "::error title=verification failed::$NAME@$VERSION was published but did not become visible on the registry within 3 minutes."
          exit 1
