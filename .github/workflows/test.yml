name: test

on:
  push:
  pull_request:

# Least privilege: the test job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported LTS lines only; Node 20 is end-of-life. The plugin itself
        # runs in the DSH browser page, these versions gate the test scripts.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and UI tests
        run: node --test test/*.test.mjs
      - name: Generated client bundle is up to date
        run: node scripts/build-client.mjs --check
